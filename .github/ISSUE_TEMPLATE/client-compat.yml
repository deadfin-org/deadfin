name: Client compatibility report
description: Report how a Jellyfin client works against Deadfin, good or bad.
labels: [client-compat]
body:
  - type: markdown
    attributes:
      value: |
        This fills a cell in docs/alpha/client-matrix.md. Passes are useful too.
  - type: textarea
    id: build
    attributes:
      label: Deadfin build
      description: The output of `curl -s http://<host>:8096/deadfin/v1/build`.
      render: json
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client and version
      placeholder: Swiftfin 1.3.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: Apple TV 4K (3rd gen), tvOS 26.0
    validations:
      required: true
  - type: input
    id: player
    attributes:
      label: Player
      description: The client's video player, if it has more than one.
      placeholder: Native (AVPlayer) or VLC
  - type: dropdown
    id: method
    attributes:
      label: Test method
      options:
        - Real app on a real device
        - Real app in a simulator or emulator
        - Request replay
    validations:
      required: true
  - type: checkboxes
    id: areas
    attributes:
      label: What did you test?
      options:
        - label: Login and QuickConnect
        - label: Browse
        - label: Direct play
        - label: Transcode
        - label: Subtitles
        - label: Resume sync
  - type: textarea
    id: result
    attributes:
      label: Results
      description: For each area, pass or fail, and what failed. Name the media (codecs) for playback results.
    validations:
      required: true
